name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name offline_black_calendar --org com.tomasthrawat

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify release has no Internet permission
        run: |
          if grep -R "android.permission.INTERNET" android/app/src/main; then
            echo "Internet permission found in the release/main manifest."
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-black-calendar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
