name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name black --org com.calender

      - name: Apply Android app identity
        run: |
          sed -i 's/android:label="[^"]*"/android:label="التقويم"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/calendar_icon"#' android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/calendar_icon_xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/calendar_icon.png

      - name: Normalize analyzer configuration
        run: rm -f analysis_options.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Android identity and no Internet permission
        run: |
          grep -q 'android:label="التقويم"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/calendar_icon"' android/app/src/main/AndroidManifest.xml
          grep -R 'com.calender.black' android/app/src/main
          if grep -R "android.permission.INTERNET" android/app/src/main; then
            echo "Internet permission found in the release/main Android source."
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: offline-black-calendar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
